# Production-style stack: API (Node + Strands agents) and web (nginx serving the built UI).
#   cp .env.example .env    # optional: switch to Bedrock, set AWS creds
#   docker compose up --build
#   open http://localhost:8080          (resident view)
#   open http://localhost:8080/#/dispatch
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      CITYCARE_MODE: ${CITYCARE_MODE:-${CITYOPS_MODE:-mock}}
      DATABASE_URL: ${DATABASE_URL:-}
      DISPATCHER_SIGNUP_CODE: ${DISPATCHER_SIGNUP_CODE:-}
      DISPATCHER_OPEN_SIGNUP: ${DISPATCHER_OPEN_SIGNUP:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      SEED_SOURCE: ${SEED_SOURCE:-}
      MOCK_DELAY_MS: ${MOCK_DELAY_MS:-350}
      BEDROCK_RPM: ${BEDROCK_RPM:-24}
      BEDROCK_MAX_CONCURRENCY: ${BEDROCK_MAX_CONCURRENCY:-4}
      REPORT_CONCURRENCY: ${REPORT_CONCURRENCY:-2}
      BEDROCK_MAX_TOKENS: ${BEDROCK_MAX_TOKENS:-1024}
      BEDROCK_MAX_TOKENS_LONG: ${BEDROCK_MAX_TOKENS_LONG:-2048}
      BEDROCK_THROTTLE_BACKOFF_S: ${BEDROCK_THROTTLE_BACKOFF_S:-8,15,30,45,60}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      INTAKE_MODEL_ID: ${INTAKE_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      PHOTON_URL: ${PHOTON_URL:-https://photon.komoot.io}
      REASONING_MODEL_ID: ${REASONING_MODEL_ID:-us.anthropic.claude-sonnet-4-6}
    volumes:
      - citycare-state:/app/var
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  citycare-state:
