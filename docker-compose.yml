# Production-style stack: API (Node + Strands agents) and web (nginx serving the built UI).
#   cp .env.example .env    # optional: switch to Bedrock, set AWS creds
#   docker compose up --build
#   open http://localhost:8080          (resident view)
#   open http://localhost:8080/#/dispatch
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      CITYCARE_MODE: ${CITYCARE_MODE:-mock}
      MOCK_DELAY_MS: ${MOCK_DELAY_MS:-350}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      INTAKE_MODEL_ID: ${INTAKE_MODEL_ID:-anthropic.claude-haiku-5-5}
      REASONING_MODEL_ID: ${REASONING_MODEL_ID:-anthropic.claude-sonnet-5-5}
    volumes:
      - citycare-state:/app/var
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  citycare-state:
