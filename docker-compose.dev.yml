# Hot-reload dev stack: source is bind-mounted, API restarts on change, Vite serves the UI.
#   docker compose -f docker-compose.dev.yml up
#   open http://localhost:5173
services:
  api:
    image: node:22-alpine
    working_dir: /app/api
    command: sh -c "npm ci && node --watch src/server.js"
    environment:
      CITYCARE_MODE: ${CITYCARE_MODE:-${CITYOPS_MODE:-mock}}
      DATABASE_URL: ${DATABASE_URL:-}
      DISPATCHER_SIGNUP_CODE: ${DISPATCHER_SIGNUP_CODE:-}
      DISPATCHER_OPEN_SIGNUP: ${DISPATCHER_OPEN_SIGNUP:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      SEED_SOURCE: ${SEED_SOURCE:-}
      MOCK_DELAY_MS: ${MOCK_DELAY_MS:-350}
      BEDROCK_RPM: ${BEDROCK_RPM:-24}
      BEDROCK_MAX_CONCURRENCY: ${BEDROCK_MAX_CONCURRENCY:-4}
      REPORT_CONCURRENCY: ${REPORT_CONCURRENCY:-2}
      BEDROCK_MAX_TOKENS: ${BEDROCK_MAX_TOKENS:-1024}
      BEDROCK_MAX_TOKENS_LONG: ${BEDROCK_MAX_TOKENS_LONG:-2048}
      BEDROCK_THROTTLE_BACKOFF_S: ${BEDROCK_THROTTLE_BACKOFF_S:-8,15,30,45,60}
      STATE_DIR: /app/api/var
      AWS_REGION: ${AWS_REGION:-us-east-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      INTAKE_MODEL_ID: ${INTAKE_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      PHOTON_URL: ${PHOTON_URL:-https://photon.komoot.io}
      REASONING_MODEL_ID: ${REASONING_MODEL_ID:-us.anthropic.claude-sonnet-4-6}
    volumes:
      - .:/app
      - api-node-modules:/app/api/node_modules
    ports:
      - "8080:8080"

  web:
    image: node:22-alpine
    working_dir: /app/web
    command: sh -c "npm ci && npm run dev"
    environment:
      API_URL: http://api:8080
      # Pick up edits and new files (e.g. in public/) on Docker Desktop, where file events
      # from the host often don't reach the container.
      VITE_USE_POLLING: "true"
    volumes:
      - ./web:/app/web
      - web-node-modules:/app/web/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  api-node-modules:
  web-node-modules:
